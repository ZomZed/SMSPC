#cloud-config
# Super Mario Sunshine PC port lobby server (generated by make_cloud_init.py; do not edit).
# Installs /opt/sms-lobby/sms_lobby_server.py as the systemd service "sms-lobby" on UDP 7700
# and opens that port in the VM's own firewall. The cloud firewall (Oracle security list /
# Google VPC rule) still needs an ingress rule for UDP 7700: see DEPLOY.md.
package_update: false
packages: [python3]
write_files:
  - path: /opt/sms-lobby/sms_lobby_server.py
    permissions: "0755"
    encoding: gz+b64
    content: 
  - path: /etc/systemd/system/sms-lobby.service
    permissions: "0644"
    encoding: b64
    content: 
runcmd:
  - 'id smslobby || useradd --system --no-create-home --shell /usr/sbin/nologin smslobby || useradd -r -M -s /sbin/nologin smslobby'
  - 'sed -i "s|^ExecStart=/usr/bin/python3|ExecStart=$(command -v python3)|" /etc/systemd/system/sms-lobby.service'
  - 'if command -v ufw >/dev/null && ufw status | grep -q "Status: active"; then ufw allow 7700/udp; fi'
  - 'if command -v firewall-cmd >/dev/null && firewall-cmd --state; then firewall-cmd --permanent --add-port=7700/udp && firewall-cmd --reload; fi'
  - 'if command -v iptables >/dev/null; then iptables -C INPUT -p udp --dport 7700 -j ACCEPT || iptables -I INPUT 1 -p udp --dport 7700 -j ACCEPT; fi'
  - 'if command -v netfilter-persistent >/dev/null; then netfilter-persistent save; elif [ -d /etc/iptables ]; then iptables-save > /etc/iptables/rules.v4; fi'
  - 'systemctl daemon-reload'
  - 'systemctl enable --now sms-lobby'
